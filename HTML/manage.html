<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <title>TaskFlow</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Inter, Arial
        }

        body {
            background: #f3f4f6
        }

        /* NAVBAR */
        .navbar {
            background: #ffffff;
            padding: 12px 20px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 25px;
        }


        .logo {
            font-weight: 600;
            color: #2563eb;
            font-size: 18px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .menu a {
            margin-right: 15px;
            text-decoration: none;
            color: #6b7280;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding-bottom: 3px;
        }

        .menu a.active {
            color: #2563eb;
            border-bottom: 2px solid #2563eb;
        }

        /* RIGHT */
        .nav-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .right {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .search {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        /* SEARCH */
        .search-box {
            display: flex;
            align-items: center;
            background: #f3f4f6;
            padding: 6px 10px;
            border-radius: 8px;
            gap: 5px;
        }

        .search-box input {
            border: none;
            outline: none;
            background: transparent;
        }

        /* ICON */
        .icon {
            font-size: 16px;
            color: #6b7280;
            cursor: pointer;
            transition: 0.2s;
        }

        .icon:hover {
            color: #2563eb;
        }

        /* AVATAR */
        .avatar {
            width: 35px;
            height: 35px;
            background: #2563eb;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.2s;
        }

        .avatar:hover {
            transform: scale(1.1);
        }

        /* BUTTON */
        .sort-btn {
            background: #fff;
            border: 1px solid #e5e7eb;
            padding: 8px 14px;
            border-radius: 12px;
            /* 🔥 bo tròn như ảnh */
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 14px;
            color: #374151;
            transition: 0.2s;
        }

        .sort-btn:hover {
            background: #f9fafb;
        }

        /* ICON */
        .sort-btn i {
            font-size: 12px;
            color: #6b7280;
        }

        /* MENU */
        .sort-menu {
            position: absolute;
            margin-top: 4px;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            width: 160px;
            display: none;
            overflow: hidden;
        }

        /* ITEM */
        .sort-menu div {
            padding: 10px;
            cursor: pointer;
            font-size: 14px;
        }

        .sort-menu div:hover {
            background: #f3f4f6;
        }

        /* TOOLBAR */
        .toolbar {
            display: flex;
            justify-content: space-between;
            padding: 15px 25px;
        }

        .btn {
            background: #2563eb;
            color: #fff;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
        }

        /* BOARD */
        .board {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            padding: 0 25px 25px;
        }

        .col {
            border-radius: 12px;
            padding: 10px;
        }

        .todo {
            background: #f9fafb
        }

        .doing {
            background: #eef2ff
        }

        .review {
            background: #fff7ed
        }

        .done {
            background: #ecfdf5
        }

        .col h3 {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .count {
            background: #e5e7eb;
            padding: 2px 8px;
            border-radius: 20px;
        }

        /* TASK */
        .task {
            background: #fff;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 10px;
            border: 1px solid #eee;
        }

        /* ===== NÚT + THÊM CÔNG VIỆC ===== */
        .add-task {
            width: 100%;
            border: 2px dashed #d1d5db;
            background: transparent;
            color: #2563eb;
            padding: 10px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 500;
            transition: 0.2s;
        }

        .add-task i {
            margin-right: 5px;
        }

        /* hover */
        .add-task:hover {
            background: #eff6ff;
            border-color: #2563eb;
            transform: translateY(-2px);
        }


        /* ===== NÚT TRONG TASK ===== */
        .actions button {
            border: none;
            padding: 8px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* icon trong nút */
        .actions button i {
            pointer-events: none;
        }

        /* ===== MOVE ===== */
        .move {
            background: #dbeafe;
            color: #2563eb;
        }

        .move:hover {
            background: #2563eb;
            color: #fff;
        }

        /* ===== EDIT ===== */
        .actions button:nth-child(2) {
            background: #fef3c7;
            color: #d97706;
        }

        .actions button:nth-child(2):hover {
            background: #f59e0b;
            color: #fff;
        }

        /* ===== DELETE ===== */
        .del {
            background: #fee2e2;
            color: #dc2626;
        }

        .del:hover {
            background: #dc2626;
            color: #fff;
        }


        /* ===== NÚT TRONG MODAL ===== */
        .box button {
            width: 100%;
            margin-top: 10px;
            background: #2563eb;
            color: #fff;
            border: none;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }

        .box button:hover {
            background: #1d4ed8;
        }


        /* ===== HIỆU ỨNG CHUNG ===== */
        button:active {
            transform: scale(0.95);
        }

        .label {
            font-size: 12px;
            padding: 4px 8px;
            border-radius: 6px;
            display: inline-block;
            margin: 6px 0;
            font-weight: 500;
        }

        /* màu từng loại */
        .frontend {
            background: #fef3c7;
            color: #92400e;
        }

        .uiux {
            background: #e9d5ff;
            color: #6b21a8;
        }

        .backend {
            background: #dbeafe;
            color: #1e40af;
        }

        .bug {
            background: #fee2e2;
            color: #991b1b;
        }

        .research {
            background: #dcfce7;
            color: #166534;
        }

        .frontend {
            background: #fef3c7
        }

        .uiux {
            background: #e9d5ff
        }

        .setup {
            background: #dbeafe
        }

        .footer {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #777;
        }

        .actions {
            margin-top: 8px;
            display: flex;
            gap: 5px;
        }

        .actions button {
            flex: 1;
            border: none;
            padding: 6px;
            border-radius: 6px;
            cursor: pointer;
        }

        .move {
            background: #dbeafe;
            color: #2563eb;
        }

        .move:hover {
            background: #2563eb;
            color: #fff;
        }

        .move i {
            transition: 0.2s;
        }

        .move:hover i {
            transform: translateX(4px) scale(1.2);
        }

        .del {
            background: #fee2e2
        }

        /* MODAL */
        /* ===== NỀN ===== */
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* ===== BOX ===== */
        .modal-box {
            width: 360px;
            background: #fff;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
            animation: fadeIn 0.25s ease;
        }

        /* ANIMATION */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* TITLE */
        .modal-box h3 {
            margin-bottom: 15px;
            font-size: 18px;
            font-weight: 600;
        }

        /* INPUT */
        .modal-box input,
        .modal-box select {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 10px;
            border: 1px solid #e5e7eb;
            outline: none;
            transition: 0.2s;
        }
        .modal-box select {
            cursor: pointer;
        }

        .modal-box select {
            appearance: none;
            /* ẩn mũi tên mặc định */
            -webkit-appearance: none;
            -moz-appearance: none;

            padding-right: 35px;
            /* tạo khoảng trống */
            background: url("data:image/svg+xml;utf8,<svg fill='%236b7280' height='20' viewBox='0 0 20 20' width='20' xmlns='http://www.w3.org/2000/svg'><path d='M5 7l5 5 5-5'/></svg>") no-repeat right 10px center;
        }

        .modal-box input:focus,
        .modal-box select:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.2);
        }

        /* BUTTON AREA */
        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 10px;
        }

        /* CANCEL */
        .cancel {
            background: #f3f4f6;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
        }

        /* SAVE */
        .save {
            background: #2563eb;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
        }

        .save:hover {
            background: #1d4ed8;
        }

        /* ===== CLOSE (optional) ===== */
        .close {
            position: absolute;
            top: 10px;
            right: 15px;
            cursor: pointer;
            font-size: 18px;
            color: #6b7280;
        }

        .close:hover {
            color: #000;
        }

        /* EDIT */
        .edit-btn {
            background: #fef3c7;
            color: #d97706;
        }

        .edit-btn:hover {
            background: #f59e0b;
            color: white;
        }

        /* DELETE */
        .del {
            background: #fee2e2;
            color: #dc2626;
        }

        .del:hover {
            background: #dc2626;
            color: white;
        }

        .actions button i {
            transition: 0.2s;
        }

        .actions button:hover i {
            transform: scale(1.2) rotate(-5deg);
        }
    </style>
</head>

<body>

    <div class="navbar">

        <!-- LEFT -->
        <div class="nav-left">
            <div class="logo">
                <i class="fa-solid fa-layer-group"></i>
                TaskFlow
            </div>

            <div class="menu">
                <a class="active"><i class="fa-solid fa-table-columns"></i> Bảng</a>
                <a><i class="fa-solid fa-list"></i> Danh sách</a>
                <a><i class="fa-solid fa-calendar"></i> Lịch</a>
                <a><i class="fa-solid fa-chart-line"></i> Thống kê</a>
            </div>
        </div>

        <!-- RIGHT -->
        <div class="nav-right">

            <!-- search -->
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input id="search" placeholder="Tìm kiếm...">
            </div>

            <!-- icons -->
            <i class="fa-regular fa-bell icon"></i>

            <!-- avatar -->
            <div class="avatar">
                <i class="fa-solid fa-user"></i>
            </div>

        </div>

    </div>

    <div class="toolbar">
        <button class="btn" onclick="openModal()">
            <i class="fa-solid fa-plus"></i> Thêm công việc
        </button>
        <div class="sort-box">

            <button class="sort-btn" onclick="toggleSortMenu()">
                <span>Sắp xếp: <b id="sortLabel">Mới nhất</b></span>
                <i class="fa-solid fa-chevron-down"></i>
            </button>

            <div class="sort-menu" id="sortMenu">
                <div onclick="setSort('new', 'Mới nhất', this)">Mới nhất</div>
                <div onclick="setSort('old', 'Cũ nhất', this)">Cũ nhất</div>
                <div onclick="setSort('az', 'A → Z', this)">A → Z</div>
                <div onclick="setSort('za', 'Z → A', this)">Z → A</div>
            </div>

        </div>
    </div>

    <div class="board">
        <div class="col todo">
            <h3>Chưa làm <span id="c1" class="count">0</span></h3>
            <div id="todo"></div>
            <button class="add-task" onclick="openModal('todo')">
                <i class="fa-solid fa-plus"></i> Thêm
            </button>
        </div>

        <div class="col doing">
            <h3>Đang làm <span id="c2" class="count">0</span></h3>
            <div id="doing"></div>
            <button class="add-task" onclick="openModal('doing')">
                <i class="fa-solid fa-plus"></i> Thêm
            </button>
        </div>

        <div class="col review">
            <h3>Đang kiểm tra <span id="c3" class="count">0</span></h3>
            <div id="review"></div>
            <button class="add-task" onclick="openModal('review')">
                <i class="fa-solid fa-plus"></i> Thêm
            </button>
        </div>

        <div class="col done">
            <h3>Hoàn thành <span id="c4" class="count">0</span></h3>
            <div id="done"></div>
            <button class="add-task" onclick="openModal('done')">
                <i class="fa-solid fa-plus"></i> Thêm
            </button>
        </div>
    </div>

    <!-- MODAL -->
    <div class="modal" id="modal">
        <div class="modal-box">

            <h3>Thêm công việc</h3>

            <input id="title" placeholder="Tên công việc">
            <input id="user" placeholder="Người thực hiện">

            <select id="label">
                <option value="frontend">Frontend</option>
                <option value="uiux">UI/UX</option>
                <option value="backend">Backend</option>
                <option value="bug">Bug</option>
                <option value="research">Research</option>
            </select>

            <div class="modal-actions">
                <button class="cancel" onclick="closeModal()">Huỷ</button>
                <button class="save" onclick="addTask()">Thêm</button>
            </div>

        </div>
    </div>

    <script>

        let tasks = JSON.parse(localStorage.getItem("tasks")) || [];

        function save() { localStorage.setItem("tasks", JSON.stringify(tasks)); }

        function render() {

            let s = document.getElementById("search").value.toLowerCase();

            let map = {
                todo: document.getElementById("todo"),
                doing: document.getElementById("doing"),
                review: document.getElementById("review"),
                done: document.getElementById("done")
            };

            Object.values(map).forEach(m => m.innerHTML = "");

            let count = { todo: 0, doing: 0, review: 0, done: 0 };

            tasks.forEach(t => {
                if (!t.title) return;
                if (!t.title.toLowerCase().includes(s)) return;

                let html = `
        <div class="task">
            <b>${t.title}</b>
            <div class="label frontend">${t.label}</div>
            <div class="footer">
                <span>${t.user}</span>
                <span>${t.date}</span>
            </div>
            <div class="actions">
                <button class="move" onclick="move(${t.id})">
                <i class="fa-solid fa-circle-arrow-right"></i>
                </button>
                <button class="edit-btn" onclick="edit(${t.id})">
                <i class="fa-regular fa-pen-to-square"></i>
                </button>

            <button class="del" onclick="delTask(${t.id})">
            <i class="fa-regular fa-trash-can"></i>
            </button>
            </div>
        </div>`;

                map[t.status].innerHTML += html;
                count[t.status]++;
            });

            c1.innerText = count.todo;
            c2.innerText = count.doing;
            c3.innerText = count.review;
            c4.innerText = count.done;
        }

        function openModal(status) {
            currentStatus = status;
            modal.style.display = "flex";
        }


        function addTask() {
            let t = {
                id: Date.now(),
                title: title.value,
                user: user.value || "Bạn",
                label: "Frontend",
                date: new Date().toLocaleDateString("vi-VN"),
                status: "todo"
            };
            tasks.push(t);
            save();
            modal.style.display = "none";
            title.value = "";
            render();
        }
        function setSort(type, label, el) {

            // 1. đổi text trên nút
            document.getElementById("sortLabel").innerText = label;

            // 2. active UI (nếu bạn vẫn dùng sort-item)
            document.querySelectorAll(".sort-item")
                .forEach(i => i.classList.remove("active"));

            if (el) el.classList.add("active");

            // 3. sort logic
            if (type === "new") tasks.sort((a, b) => b.id - a.id);
            if (type === "old") tasks.sort((a, b) => a.id - b.id);
            if (type === "az") tasks.sort((a, b) => a.title.localeCompare(b.title));
            if (type === "za") tasks.sort((a, b) => b.title.localeCompare(a.title));


            // 4. đóng menu
            document.getElementById("sortMenu").style.display = "none";

            // 5. render lại
            render();
        }
        function toggleSortMenu() {
            let menu = document.getElementById("sortMenu");

            if (menu.style.display === "block") {
                menu.style.display = "none";
            } else {
                menu.style.display = "block";
            }
        }
        document.addEventListener("click", function (e) {
            let menu = document.getElementById("sortMenu");

            if (!e.target.closest(".sort-box")) {
                menu.style.display = "none";
            }
        });

        function delTask(id) {
            tasks = tasks.filter(t => t.id !== id);
            save();
            render();
        }
        function closeModal() {
            document.getElementById("modal").style.display = "none";
        }

        function edit(id) {
            let t = tasks.find(t => t.id == id);
            let n = prompt("Sửa:", t.title);
            if (!n) return;
            t.title = n; save(); render();
        }

        function move(id) {
            let t = tasks.find(t => t.id == id);
            if (t.status == "todo") t.status = "doing";
            else if (t.status == "doing") t.status = "review";
            else if (t.status == "review") t.status = "done";
            else t.status = "todo";
            save(); render();
        }

        function sortTasks() {
            tasks.sort((a, b) => b.id - a.id);
            render();
        }

        search.addEventListener("input", render);

        document.addEventListener("DOMContentLoaded", render);

    </script>

</body>

</html>
