<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>so dem</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<style>
    body {
        margin: 0;
        font-family: system-ui;
        background: #f3f4f6;
    }

    .wrapper {
        padding: 20px;
    }

    .app {
        display: flex;
        gap: 16px;
    }

    /* SIDEBAR */
    .sidebar {
        width: 320px;
        background: #fff;
        border-radius: 14px;
        padding: 15px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
    }

    .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .header button {
        background: #3b82f6;
        color: #fff;
        border: none;
        padding: 6px 12px;
        border-radius: 6px;
        cursor: pointer;
    }

    #search {
        width: 94%;
        margin: 10px 0;
        padding: 8px;
        border: 1px solid #ddd;
        border-radius: 6px;
    }

    #noteList {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    #noteList li {
        padding: 10px;
        border-radius: 10px;
        margin-bottom: 8px;
        cursor: pointer;
        transition: 0.2s;
    }

    #noteList li:hover {
        background: #f1f5f9;
    }

    .active {
        background: #e0edff !important;
    }

    .note-title {
        font-weight: 600;
    }

    .note-body {
        font-size: 13px;
        color: #6b7280;
    }

    .note-time {
        font-size: 11px;
        color: #9ca3af;
        float: right;
    }

    /* CONTENT */
    .content {
        flex: 1;
        background: #fff;
        border-radius: 14px;
        padding: 20px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
    }

    .top {
        display: flex;
        justify-content: space-between;
    }

    #title {
        font-size: 22px;
        border: none;
        outline: none;
        width: 100%;
        font-weight: 600;
    }

    input,
    textarea {
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 8px;
    }

    input:focus,
    textarea:focus {
        border-color: #3b82f6;
    }

    .label {
        display: block;
        font-size: 15px;
        color: #6b7280;
        margin-top: 15px;
        margin-bottom: 4px;
    }

    .actions span {
        margin-left: 10px;
        cursor: pointer;
        font-size: 18px;
    }

    .icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 35px;
        height: 35px;
        border-radius: 8px;
        cursor: pointer;
        transition: 0.2s;
    }

    .icon.edit {
        color: #1e1e1f;
    }

    .icon.edit:hover {
        background: #dbeafe;
        transform: scale(1.1);
    }

    .icon.delete {
        color: #2b2a2a;
    }

    .icon.delete:hover {
        background: #fee2e2;
        transform: scale(1.1);
    }

    .meta {
        display: flex;
        justify-content: space-between;
        margin: 10px 0;
        font-size: 13px;
        color: #6b7280;
    }

    .tag {
        background: #fde68a;
        padding: 3px 8px;
        border-radius: 6px;
    }

    #body {
        width: 100%;
        height: 300px;
        border: none;
        outline: none;
        font-size: 15px;
    }
</style>

<body>
    <div class="wrapper">

        <div class="app">

            <!-- LEFT -->
            <div class="sidebar">
                <div class="header">
                    <h3>Ghi chú</h3>
                    <button onclick="addNote()">+ Thêm</button>
                </div>

                <input id="search" placeholder="Tìm kiếm ghi chú..." oninput="renderList()">

                <ul id="noteList"></ul>
            </div>

            <!-- RIGHT -->
            <div class="content">
                <div class="top">

                    <label class="label">Tiêu đề:</label>
                    <input id="title" placeholder="Nhập tiêu đề...">

                    <div class="actions">
                        <span class="icon edit" onclick="saveNote()">
                            <i class="fa-solid fa-pen"></i>
                        </span>
                        <span class="icon delete" onclick="deleteNote()">
                            <i class="fa-solid fa-trash"></i>
                        </span>
                    </div>
                </div>

                <div class="meta">
                    <span id="time"></span>

                </div>

                <label class="label">Nội dung</label>
                <textarea id="body" placeholder="Nhập nội dung..."></textarea>
            </div>

        </div>

    </div>
    <script>
        let notes = JSON.parse(localStorage.getItem("notes")) || [];
        let currentIndex = null;

        // format thời gian giống "Hôm qua", "2 ngày trước"
        function formatTime(date) {
            let now = new Date();
            let d = new Date(date);

            let diff = Math.floor((now - d) / (1000 * 60 * 60 * 24));

            if (diff === 0) return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            if (diff === 1) return "Hôm qua";
            return diff + " ngày trước";
        }

        function renderList() {
            let list = document.getElementById("noteList");
            let search = document.getElementById("search").value.toLowerCase();

            list.innerHTML = "";

            notes.forEach((note, index) => {
                if (
                    note.title.toLowerCase().includes(search) ||
                    note.body.toLowerCase().includes(search)
                ) {
                    let li = document.createElement("li");

                    li.innerHTML = `
        <div>
          <span class="note-title">${note.title || "Không tiêu đề"}</span>
          <span class="note-time">${formatTime(note.time)}</span>
        </div>
        <div class="note-body">${note.body.slice(0, 40)}</div>
      `;

                    if (index === currentIndex) li.classList.add("active");

                    li.onclick = () => selectNote(index);

                    list.appendChild(li);
                }
            });
        }

        function selectNote(index) {
            currentIndex = index;

            document.getElementById("title").value = notes[index].title;
            document.getElementById("body").value = notes[index].body;
            document.getElementById("time").innerText = notes[index].time;

            renderList();
        }

        function addNote() {
            let note = {
                title: "",
                body: "",
                time: new Date()
            };

            notes.unshift(note);
            currentIndex = 0;

            save();
            renderList();
            selectNote(0);
        }

        function saveNote() {
            // nếu chưa chọn thì tạo mới luôn
            if (currentIndex === null) {
                addNote();
            }

            notes[currentIndex].title = document.getElementById("title").value;
            notes[currentIndex].body = document.getElementById("body").value;

            save();
            renderList();
        }
        function deleteNote() {
            if (currentIndex === null) return;

            notes.splice(currentIndex, 1);
            currentIndex = null;

            document.getElementById("title").value = "";
            document.getElementById("body").value = "";
            document.getElementById("time").innerText = "";

            save();
            renderList();
        }

        function save() {
            localStorage.setItem("notes", JSON.stringify(notes));
        }

        renderList();
    </script>
</body>

</html>
