<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #f5f7fa;
        font-family: Arial;
    }

    form {
        background: white;
        padding: 30px;
        border-radius: 10px;
        width: 300px;
    }

    h2 {
        text-align: center;
    }

    input {
        width: 92%;
        padding: 10px;
        margin: 10px 0;
    }

    /* password box */
    .password-box {
        position: relative;
    }

    #togglePass {
        position: absolute;
        right: 10px;
        top: 50%;
        transform: translateY(-50%);
        cursor: pointer;
    }

    /* lỗi */
    .error {
        color: red;
        font-size: 12px;
    }

    .error-input {
        border: 2px solid red;
    }

    /* button */
    button {
        width: 100%;
        padding: 14px;
        background: linear-gradient(to right, #4facfe, #00c6ff);
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        cursor: pointer;
    }
</style>

<body>
    <form id="form">
        <h2>Đăng ký tài khoản</h2>
        <form id="form">
            <input type="text" id="name" placeholder="Họ tên">
            <small class="error" id="nameError"></small>

            <input type="text" id="email" placeholder="Email">
            <small class="error" id="emailError"></small>

            <!-- password có icon mắt -->
            <div class="password-box">
                <input type="password" id="password" placeholder="Mật khẩu">
                <span id="togglePass">👁</span>
            </div>
            <small class="error" id="passError"></small>

            <button type="submit">Đăng ký</button>
        </form>

        <script>
            let form = document.getElementById("form");
            let password = document.getElementById("password");

            // lấy icon con mắt 👁
            let toggle = document.getElementById("togglePass");

            // bắt sự kiện click vào icon 👁
            toggle.addEventListener("click", function () {

                // kiểm tra: nếu hiện tại đang là dạng password (đang bị ẩn)
                if (password.type === "password") {

                    password.type = "text";   // đổi sang text → hiện mật khẩu
                    toggle.innerText = "🙈";  // đổi icon → báo là đang hiện
                } else {
                    password.type = "password"; // đổi lại password → ẩn mật khẩu
                    toggle.innerText = "👁";    // đổi icon lại

                }
            });

            // bắt sự kiện submit form (khi bấm nút đăng ký)
            form.addEventListener("submit", function (e) {

                e.preventDefault(); //  chặn reload trang

                // lấy các ô input
                let name = document.getElementById("name");
                let email = document.getElementById("email");

                let isValid = true; // giả sử ban đầu form hợp lệ

                // xóa hết nội dung thông báo lỗi
                document.querySelectorAll(".error").forEach(e => e.innerText = "");

                // xóa viền đỏ ở tất cả input
                document.querySelectorAll("input").forEach(i => i.classList.remove("error-input"));

                // ===== validate NAME =====

                // nếu name rỗng (sau khi đã bỏ khoảng trắng)
                if (name.value.trim() === "") {

                    // hiện thông báo lỗi
                    document.getElementById("nameError").innerText = "Không được để trống";
                    name.classList.add("error-input");
                    isValid = false; // đánh dấu form có lỗi
                }

                // ===== validate EMAIL =====

                // tạo regex kiểm tra email
                let emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

                // nếu email rỗng
                if (email.value.trim() === "") {

                    document.getElementById("emailError").innerText = "Không được để trống";
                    email.classList.add("error-input");
                    isValid = false;

                }
                // nếu email sai định dạng
                else if (!emailRegex.test(email.value)) {

                    document.getElementById("emailError").innerText = "Email không hợp lệ";
                    email.classList.add("error-input");
                    isValid = false;
                }

                // ===== validate PASSWORD =====
                // nếu mật khẩu ít hơn 6 ký tự
                if (password.value.length < 6) {

                    document.getElementById("passError").innerText = "Ít nhất 6 ký tự";
                    password.classList.add("error-input");
                    isValid = false;
                }

                // ===== nếu không có lỗi =====
                if (isValid) {
                    alert("Đăng ký thành công!"); // thông báo thành công
                }
            });
        </script>
</body>

</html>
